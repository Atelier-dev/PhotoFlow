<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoFlow</title>
    <!-- Use Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Draggable title bar for modern aesthetic -->
    <div class="titlebar">PhotoFlow</div>
    <div id="app">
      <nav class="tabs">
        <button class="tab active" data-target="extract">Extract</button>
        <button class="tab" data-target="compress">Compress</button>
        <button class="tab" data-target="merge">Merge ZIPs</button>
      </nav>
      
      <main class="content">
        <!-- Extract View -->
        <section id="extract" class="view active">
          <div class="header-container">
            <h2>Extract from List</h2>
          </div>
          
          <div class="input-group mt-20">
            <label>Source Folder</label>
            <div class="browse-row">
              <input type="text" id="extractSourceInput" readonly placeholder="Select a folder with images...">
              <button id="btnBrowseExtractSource" class="btn-primary">Browse</button>
            </div>
          </div>

          <div class="input-group mt-20">
            <label>Filenames to Extract</label>
            <textarea id="extractListInput" placeholder="DSC01107, DSC01116, DSC01122..."></textarea>
            <div class="hint" style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">Supports commas, spaces, and line breaks.</div>
          </div>

          <div class="input-group mt-20">
            <label>Output Folder</label>
            <div class="browse-row">
              <input type="text" id="extractOutputInput" readonly placeholder="Select destination folder...">
              <button id="btnBrowseExtractOutput" class="btn-primary">Browse</button>
            </div>
          </div>

          <button id="btnStartExtract" class="btn-primary btn-large mt-30" disabled>Extract Files</button>

          <div class="progress-container mt-20 hidden" id="extractProgressContainer">
            <div class="progress-bar">
              <div class="progress-fill" id="extractProgressFill"></div>
            </div>
            <div class="progress-text mt-10" id="extractProgressText">0 / 0 files copied</div>
          </div>
        </section>

        <!-- Compress View -->
        <section id="compress" class="view">
          <div class="header-container">
            <h2>Batch Compression</h2>
          </div>

          <div class="input-group mt-20">
            <label>Input Folder (All Images)</label>
            <div class="browse-row">
              <input type="text" id="compressSourceInput" readonly placeholder="Select a folder to compress...">
              <button id="btnBrowseCompressSource" class="btn-primary">Browse</button>
            </div>
            <div class="hint mt-10" id="compressEstimationText" style="color: var(--text-muted); font-size: 13px;">Estimated Content: Select a folder...</div>
          </div>

          <div class="mt-30">
            <label style="font-size: 14px; font-weight: 500; color: var(--text-main);">Compression Mode</label>
            <div class="radio-group mt-10">
              <label class="radio-card"><input type="radio" name="compMode" value="high"> High (Width 1080px, Qual 70)</label>
              <label class="radio-card"><input type="radio" name="compMode" value="medium" checked> Medium (Long edge 2560px, Qual 75)</label>
              <label class="radio-card"><input type="radio" name="compMode" value="low"> Low (Long edge 4000px, Qual 90)</label>
              <label class="radio-card"><input type="radio" name="compMode" value="custom"> Custom</label>
            </div>
          </div>

          <div id="customSettingsBlock" class="custom-settings mt-20 hidden">
            <div class="input-group">
              <label>Resize Based On</label>
              <select id="customResizeAxis" class="select-input">
                <option value="long">Long Edge</option>
                <option value="short">Short Edge</option>
                <option value="width">Width</option>
              </select>
            </div>
            <div class="slider-row mt-10">
              <label>Size (px): <span id="valSize">2048</span></label>
              <input type="range" id="customSize" min="1080" max="4000" value="2048">
            </div>
            <div class="slider-row mt-10">
              <label>Quality: <span id="valQual">80</span></label>
              <input type="range" id="customQual" min="60" max="95" value="80">
            </div>
          </div>

          <div class="input-group mt-30">
            <label>Output Folder</label>
            <div class="browse-row">
              <input type="text" id="compressOutputInput" readonly placeholder="Select destination folder...">
              <button id="btnBrowseCompressOutput" class="btn-primary">Browse</button>
            </div>
          </div>

          <button id="btnStartCompress" class="btn-primary btn-large mt-30" disabled>Start Compression</button>

          <div class="progress-container mt-20 hidden" id="compProgressContainer">
            <div class="progress-bar">
              <div class="progress-fill" id="compProgressFill"></div>
            </div>
            <div class="progress-text mt-10" id="compProgressText">Initializing...</div>
          </div>
        </section>

        <!-- Merge View -->
        <section id="merge" class="view">
          <div class="header-container">
            <h2>Merge & Extract ZIPs</h2>
          </div>
          
          <div class="input-group mt-20">
            <label>Folder containing split ZIPs</label>
            <div class="browse-row">
              <input type="text" id="mergeSourceInput" readonly placeholder="Select folder with Archive.zip, Archive(1).zip...">
              <button id="btnBrowseMergeSource" class="btn-primary">Browse</button>
            </div>
            <div class="hint mt-10" id="mergeEstimationText" style="color: var(--text-muted); font-size: 13px;">Estimated Content: Select a folder...</div>
          </div>

          <div class="input-group mt-20">
             <label>Options</label>
             <div class="checkbox-group mt-10">
                <label class="checkbox-label"><input type="checkbox" id="mergeSkipDuplicates" checked> Skip duplicate files</label>
                <label class="checkbox-label"><input type="checkbox" id="mergeNormalizeRoot" checked> Merge structure (remove redundant root folders)</label>
             </div>
          </div>

          <div class="input-group mt-30">
            <label>Output Folder</label>
            <div class="browse-row">
              <input type="text" id="mergeOutputInput" readonly placeholder="Select destination folder...">
              <button id="btnBrowseMergeOutput" class="btn-primary">Browse</button>
            </div>
          </div>

          <button id="btnStartMerge" class="btn-primary btn-large mt-30" disabled>Start Merge</button>

          <div class="progress-container mt-20 hidden" id="mergeProgressContainer">
            <div class="progress-bar">
              <div class="progress-fill" id="mergeProgressFill"></div>
            </div>
            <div class="progress-text mt-10" id="mergeProgressText">Initializing...</div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
